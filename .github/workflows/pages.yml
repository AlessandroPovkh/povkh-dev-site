name: Deploy Povkh.Dev preview to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      POVKH_SITE_MODE: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify and build preview
        run: |
          npm run test:content
          npm run check
          npm run build
          npm run verify:build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
